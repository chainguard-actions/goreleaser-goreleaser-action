name: Test workdir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create subdirectory
        run: mkdir -p myproject
      - id: action
        uses: .
        with:
          workdir: 'myproject'
          install-only: 'true'
      - name: Assert goreleaser is installed when using workdir
        run: |
          echo "Checking goreleaser binary..."
          if ! command -v goreleaser &>/dev/null; then
            echo "FAIL: goreleaser binary not found in PATH"
            exit 1
          fi
          goreleaser --version
          echo "PASS"
