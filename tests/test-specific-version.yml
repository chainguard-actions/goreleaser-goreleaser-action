name: Test GoReleaser install specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 'v2.5.0'
          install-only: 'true'
      - name: Assert GoReleaser v2.5.0 is installed
        run: |
          echo "Checking goreleaser binary..."
          if ! command -v goreleaser >/dev/null 2>&1; then
            echo "FAIL: goreleaser not found on PATH"
            exit 1
          fi
          VERSION_OUTPUT="$(goreleaser --version 2>&1)"
          echo "goreleaser version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "2.5.0"; then
            echo "PASS: goreleaser v2.5.0 is installed"
          else
            echo "FAIL: expected version 2.5.0 but got: $VERSION_OUTPUT"
            exit 1
          fi
