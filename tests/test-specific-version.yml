name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 'v2.9.0'
          install-only: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert goreleaser v2 is installed
        run: |
          echo "PATH: $PATH"
          echo "Checking goreleaser version..."
          GORELEASER_BIN=$(which goreleaser 2>/dev/null || true)
          if [ -z "$GORELEASER_BIN" ]; then
            GORELEASER_BIN=$(find /opt/hostedtoolcache /root/.cache /tmp -name goreleaser -type f 2>/dev/null | head -1 || true)
          fi
          if [ -z "$GORELEASER_BIN" ]; then
            echo "FAIL: goreleaser not found"
            exit 1
          fi
          echo "goreleaser found at: $GORELEASER_BIN"
          VERSION_OUTPUT=$("$GORELEASER_BIN" --version 2>&1 || true)
          echo "Version output: $VERSION_OUTPUT"
          # Check that it's a v2.x release - goreleaser outputs version in various formats
          if echo "$VERSION_OUTPUT" | grep -qiE '2\.[0-9]+\.[0-9]+'; then
            echo "PASS: goreleaser v2.x confirmed"
          else
            echo "FAIL: expected goreleaser v2.x, got: $VERSION_OUTPUT"
            exit 1
          fi
