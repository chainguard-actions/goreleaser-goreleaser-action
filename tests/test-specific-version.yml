name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TOOL_CACHE: /tmp/runner-tool-cache
      RUNNER_TEMP: /tmp/runner-temp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare tool cache and temp directories
        run: |
          mkdir -p /tmp/runner-tool-cache
          mkdir -p /tmp/runner-temp
      - id: action
        uses: .
        with:
          distribution: 'goreleaser'
          version: 'v2.4.8'
          install-only: 'true'
      - name: Assert goreleaser binary is available
        run: |
          echo "Checking goreleaser binary..."
          if ! command -v goreleaser > /dev/null 2>&1; then
            echo "FAIL: goreleaser binary not found on PATH"
            exit 1
          fi
          echo "PASS: goreleaser found at $(command -v goreleaser)"
      - name: Assert goreleaser version matches requested
        run: |
          VERSION_OUTPUT=$(goreleaser --version 2>&1)
          echo "Version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "2.4.8"; then
            echo "PASS: goreleaser version 2.4.8 confirmed"
          else
            echo "FAIL: expected version 2.4.8 in output"
            exit 1
          fi
