name: Test version-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version-file: '.tool-versions'
          workdir: 'actions/hardened/goreleaser--goreleaser-action/v7.2.2/tests/fixtures'
          install-only: 'true'
      - name: Assert goreleaser is installed from version-file
        run: |
          which goreleaser
          goreleaser --version
          echo "PASS: goreleaser installed using version-file input"
