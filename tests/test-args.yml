name: Test args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          distribution: goreleaser
          version: '~> v2'
          install-only: 'true'
          args: '--version'
      - name: Assert goreleaser is installed when args is provided
        run: |
          which goreleaser || (echo "FAIL: goreleaser not found in PATH" && exit 1)
          goreleaser --version
          echo "PASS: goreleaser installed with args input provided"
