name: Test default version install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install-only: 'true'
      - name: Assert goreleaser v2 is installed
        run: |
          echo "Checking goreleaser default (v2) install..."
          if ! command -v goreleaser &>/dev/null; then
            echo "FAIL: goreleaser binary not found in PATH"
            exit 1
          fi
          VERSION_OUTPUT="$(goreleaser --version 2>&1)"
          echo "version output: $VERSION_OUTPUT"
          # Default version is ~> v2, so major version should be 2
          # GoReleaser v2 outputs something like "goreleaser version 2.x.x" or "version: 2.x.x"
          if ! echo "$VERSION_OUTPUT" | grep -qE "2\.[0-9]+\.[0-9]+"; then
            echo "FAIL: expected goreleaser v2.x to be installed"
            exit 1
          fi
          echo "PASS"
