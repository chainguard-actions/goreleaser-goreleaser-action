name: Test install-only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install-only: 'true'
      - name: Assert goreleaser is installed
        run: |
          echo "Checking goreleaser binary..."
          # The action uses core.addPath which sets PATH for subsequent steps
          echo "PATH: $PATH"
          if ! command -v goreleaser &>/dev/null; then
            echo "FAIL: goreleaser binary not found in PATH"
            exit 1
          fi
          echo "goreleaser found at: $(command -v goreleaser)"
          goreleaser --version 2>&1 || true
          echo "PASS"
