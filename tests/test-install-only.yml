name: Test install-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          distribution: goreleaser
          version: '~> v2'
          install-only: 'true'
      - name: Assert goreleaser is on PATH
        run: |
          echo "PATH: $PATH"
          echo "Checking goreleaser is available on PATH..."
          which goreleaser || (echo "FAIL: goreleaser not found on PATH"; exit 1)
          echo "PASS: goreleaser found at $(which goreleaser)"
      - name: Assert goreleaser version is v2.x
        run: |
          VERSION_OUTPUT=$(goreleaser --version 2>&1 || true)
          echo "actual version output: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: goreleaser --version produced no output"
            exit 1
          fi
          echo "PASS: goreleaser version output looks correct"
