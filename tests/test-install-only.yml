name: Test GoReleaser install-only (basic)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install-only: 'true'
      - name: Assert GoReleaser is installed and on PATH
        run: |
          echo "Checking goreleaser binary..."
          if ! command -v goreleaser >/dev/null 2>&1; then
            echo "FAIL: goreleaser not found on PATH"
            exit 1
          fi
          VERSION_OUTPUT="$(goreleaser --version 2>&1)"
          echo "goreleaser version output: $VERSION_OUTPUT"
          echo "PASS: goreleaser is installed"
